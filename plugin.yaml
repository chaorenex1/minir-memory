name: minir
version: 0.1.0
description: "Minir — minimal local-first memory provider template: SQLite turn/note store, keyword recall, four tools, and base/dialectic layer turn counting. Stdlib only; fork it to build your own provider."
author: chaorenex1
license: MIT
tags:
  - memory
  - template
# The provider's own surface (MemoryProvider) is reached through memory.provider;
# these are the plugin-level hooks register(ctx) subscribes to. The host validator fails
# the manifest when register() adds a hook that is not declared here.
provides_hooks:
  - on_session_start
  - on_session_reset
  - on_session_finalize
  - pre_llm_call
  - post_llm_call
  - post_tool_call
