name: minir
version: 0.9.0
description: "Minir — local-first memory plugin: independent base/review layers, four-section user/AI cards with a rolling window summary, a three-day review of four durable card files, knowledge pages with path-hint retrieval, an idle-session summary and knowledge extraction, per-turn token accounting, the minir toolset, FTS5 recall, and a JSON transcript audit trail."
author: chaorenex1
license: MIT
tags:
  - memory
  - template
# The provider's own surface (MemoryProvider) is reached through memory.provider;
# these are the plugin-level hooks register(ctx) subscribes to. The host validator fails
# the manifest when register() adds a hook that is not declared here.
provides_hooks:
  - on_session_start
  - on_session_reset
  - on_session_finalize
  - pre_llm_call
  - post_llm_call
  - post_tool_call
  - pre_tool_call
  - pre_verify
  - on_interim_message
  - post_api_request
  - api_request_error
provides_middleware:
  - llm_request
# Registering a tool through the plugin context (not through the MemoryProvider's
# get_tool_schemas) requires declaring it here, or `hermes plugins validate` fails the
# manifest with "undeclared tools registered".
provides_tools:
  - adviser_consult
  - adviser_session_search
  - minir_search
  - minir_remember
  - minir_forget
  - minir_stats
