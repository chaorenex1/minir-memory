# Pytest config lives INSIDE tests/ on purpose.
#
# The repository root is the plugin package (it contains the plugin's
# `__init__.py`), and pytest treats any ancestor directory containing an
# `__init__.py` as a collectable package — it would import the plugin module
# itself before running any test. Keeping the inifile here makes rootdir =
# tests/, so pytest's ancestor walk stops before reaching the plugin package.
#
# Run either of:
#     python -m pytest tests -q            (from the repo root)
#     python -m pytest -c pytest.ini       (from tests/)
[pytest]
addopts = -q
